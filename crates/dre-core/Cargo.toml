[package]
name = "dre-core"
description = "DRE core engine: project parsing, validation and the run path"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["dre", "reporting", "sql", "excel", "jinja"]
categories = ["command-line-utilities", "database"]
exclude = ["tests/"]

[dependencies]
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
thiserror.workspace = true
serde-saphyr.workspace = true
schemars.workspace = true
regex.workspace = true
# `zip:` on destination entries: deflate, AES-256 and ZipCrypto. MIT; its AES dependencies are
# MIT/Apache-2.0.
zip = { version = "9", default-features = false, features = ["deflate", "aes-crypto"] }
walkdir.workspace = true
semver.workspace = true
minijinja.workspace = true
minijinja-contrib.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
calamine = { version = "0.37", features = ["dates"] }
csv = "1"
dre-protocol.workspace = true
arrow.workspace = true
ureq = "3"
sha2 = "0.11"
flate2 = "1"
tar = "0.4"
croner = "4"
rrule = "0.14"
# Disk-backed per-row key and job indexes keep population memory bounded. SQLite is MIT.
rusqlite = { version = "0.40", features = ["bundled", "fallible_uint"] }
tempfile.workspace = true
sqlparser = { version = "0.63", features = ["visitor"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }
