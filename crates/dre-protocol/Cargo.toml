[package]
name = "dre-protocol"
description = "The DRE plugin protocol: frames, messages, host side, plugin SDK and conformance suite"
# Versioned on its own, not with DRE: plugins depend on it. The wire protocol has its own
# integer version too (MIN_VERSION/MAX_VERSION), which changes only when the messages do.
version = "0.8.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["dre", "reporting", "plugin", "protocol", "arrow"]
categories = ["development-tools"]
exclude = ["tests/"]

[dependencies]
arrow.workspace = true
log = { version = "0.4", features = ["std"] }
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Pipes"] }

[dev-dependencies]
tempfile.workspace = true
