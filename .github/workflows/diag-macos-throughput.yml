name: diag macOS throughput

# Temporary measurement only. Not merged; deleted before the real change.
# `shared-key: test` reuses the rust-cache the real `test` job saves on master, so these jobs
# build warm like a branch run does.
on:
  push:
    branches: [diag/macos-throughput]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  threads:
    # nextest test-threads sweep: default (3), 6, 8.
    strategy:
      fail-fast: false
      matrix:
        threads: ["default", "6", "8"]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v2-rust
          shared-key: test
          save-if: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/plugin/go.mod
          cache-dependency-path: go/*/go.sum
      - name: Build the Go packages
        run: |
          dir="$RUNNER_TEMP/go-plugins"; mkdir -p "$dir"
          for p in databricks bigquery snowflake clickhouse; do
            (cd "go/$p" && go build -o "$dir/dre-plugin-$p" .) || exit 1
          done
          echo "DRE_TEST_GO_PLUGINS=$dir" >> "$GITHUB_ENV"
      - name: Build bins (timed)
        run: |
          s=$SECONDS; cargo build --workspace --bins; echo "DIAG build_bins=$((SECONDS-s))s"
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: nextest
      - name: Compile test binaries (timed)
        run: |
          s=$SECONDS; cargo nextest run --workspace --no-run; echo "DIAG compile_tests=$((SECONDS-s))s"
      - name: Run nextest
        env:
          THREADS: ${{ matrix.threads }}
          DRE_TEST_PREBUILT_BINS: "1"
        run: |
          if [ "$THREADS" != "default" ]; then export NEXTEST_TEST_THREADS="$THREADS"; fi
          s=$SECONDS
          cargo nextest run --workspace --no-fail-fast
          echo "DIAG threads=$THREADS step=$((SECONDS-s))s"

  libsplit:
    # In-process unit tests with cargo test --lib, nextest for the rest.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v2-rust
          shared-key: test
          save-if: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/plugin/go.mod
          cache-dependency-path: go/*/go.sum
      - name: Build the Go packages
        run: |
          dir="$RUNNER_TEMP/go-plugins"; mkdir -p "$dir"
          for p in databricks bigquery snowflake clickhouse; do
            (cd "go/$p" && go build -o "$dir/dre-plugin-$p" .) || exit 1
          done
          echo "DRE_TEST_GO_PLUGINS=$dir" >> "$GITHUB_ENV"
      - run: cargo build --workspace --bins
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: nextest
      - run: cargo nextest run --workspace --no-run
      - name: cargo test --lib (in-process unit tests, timed)
        env:
          DRE_TEST_PREBUILT_BINS: "1"
        run: |
          s=$SECONDS; cargo test --workspace --lib --no-fail-fast 2>&1 | tail -6
          echo "DIAG lib_cargo_test=$((SECONDS-s))s"
      - name: nextest without lib targets (timed)
        env:
          DRE_TEST_PREBUILT_BINS: "1"
        run: |
          s=$SECONDS
          cargo nextest run --workspace --no-fail-fast -E 'not kind(lib)'
          echo "DIAG nextest_no_lib=$((SECONDS-s))s"

  serial:
    # Serial vs parallel on two packages: equal walls mean fixed per-test cost.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v2-rust
          shared-key: test
          save-if: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/plugin/go.mod
          cache-dependency-path: go/*/go.sum
      - run: cargo build --workspace --bins
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: nextest
      - run: cargo nextest run --workspace --no-run
      - name: Parallel then serial on dre-core and dre-protocol
        env:
          DRE_TEST_PREBUILT_BINS: "1"
        run: |
          s=$SECONDS
          cargo nextest run -p dre-core -p dre-protocol --no-fail-fast
          echo "DIAG subset_parallel=$((SECONDS-s))s"
          s=$SECONDS
          cargo nextest run -p dre-core -p dre-protocol --no-fail-fast --test-threads=1
          echo "DIAG subset_serial=$((SECONDS-s))s"

  spawn:
    # Per-process exec cost with a warm page cache (binaries built in this job).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v2-rust
          shared-key: test
          save-if: false
      - run: cargo build --workspace --bins
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: nextest
      - run: cargo nextest run --workspace --no-run
      - name: Host facts and spawn cost
        run: |
          (nproc || sysctl -n hw.ncpu) 2>&1
          sysctl -n hw.ncpu hw.memsize
          du -sh target/debug/deps
          find target/debug/deps -type f -perm -111 -size +1M -exec ls -l {} + 2>/dev/null \
            | awk '{print $5, $9}' | sort -nr | head -6
          python3 - <<'PY'
          import glob, os, statistics, subprocess, time
          bins = [(os.path.getsize(p), p) for p in glob.glob("target/debug/deps/*")
                  if os.access(p, os.X_OK) and os.path.isfile(p)]
          bins.sort()
          big = bins[-1][1]
          def med(cmd, n=20):
              ts = []
              for _ in range(n):
                  t = time.perf_counter()
                  subprocess.run(cmd, capture_output=True)
                  ts.append(time.perf_counter() - t)
              return statistics.median(ts)
          print(f"DIAG biggest={os.path.getsize(big)/1e6:.1f}MB")
          print(f"DIAG spawn_true_ms={med(['/usr/bin/true'])*1000:.1f}")
          print(f"DIAG spawn_big_list_ms={med([big,'--list','--format','terse'])*1000:.1f}")
          PY
