name: Public examples
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.scope.outputs.full }}
      examples: ${{ steps.scope.outputs.examples }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: scope
        run: python3 .github/scripts/ci_scope.py --base "$BASE_SHA" --head "$HEAD_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  examples:
    needs: scope
    # Mixed engine/workflow changes run every example against source builds in CI instead.
    if: needs.scope.outputs.full == 'false' && needs.scope.outputs.examples != '[]'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Exercise the public install path on clean machines. The main CI matrix also runs
      # these examples against freshly built core and plugins when engine code changes.
      # No build artifact reuse: install the exact core version declared by this checkout.
      # An unpublished version fails here rather than silently validating an older engine.
      - name: Install the matching released CLI
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, subprocess, sys
          sys.path.insert(0, ".github/scripts")
          from plugin_versions import version
          core = version(pathlib.Path("Cargo.toml").read_text(), "Cargo.toml")
          if not core:
              raise SystemExit("Cargo.toml has no core version")
          subprocess.run([sys.executable, "-m", "pip", "install", f"dre-cli=={core}"], check=True)
          PY
      - run: python .github/scripts/check_examples.py --selection-json "$EXAMPLES"
        env:
          EXAMPLES: ${{ needs.scope.outputs.examples }}
