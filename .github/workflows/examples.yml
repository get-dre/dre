name: Public examples
on:
  push:
    branches: [master]
    paths:
      - "examples/**"
      - "docs/first-report.md"
      - "docs/examples.md"
      - ".github/scripts/check_examples.py"
      - ".github/workflows/examples.yml"
  pull_request:
    paths:
      - "examples/**"
      - "docs/first-report.md"
      - "docs/examples.md"
      - ".github/scripts/check_examples.py"
      - ".github/workflows/examples.yml"
permissions:
  contents: read
jobs:
  examples:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Exercise the public install path on clean machines. The main CI matrix also runs
      # these examples against freshly built core and plugins when engine code changes.
      - run: python -m pip install "dre-cli>=0.4,<0.5"
      - run: python .github/scripts/check_examples.py
