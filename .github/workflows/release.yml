name: Release

# Two kinds of release, by tag:
#
#   v<version>            DRE itself: the `dre` CLI for each platform, install.sh, the
#                         `dre-cli` wheels for PyPI, dre-protocol/dre-core/dre-cli on crates.io,
#                         and the Homebrew formula and Scoop manifest (package-managers.yml).
#                         E.g. v0.1.0, v0.1.0-rc.1.
#   <package>-v<version>  one plugin package, which then goes into the registry index that `dre`
#                         installs plugins from (the `packages.json` asset of the `registry`
#                         release, see docs/registry.md). E.g. duckdb-v1.0.0, object_store-v1.2.0.
#
# Plugins have their own versions (plugins/<package>/Cargo.toml, go/<package>/VERSION) and are
# released only when they change; .github/scripts/release_plan.py checks the tag against them. A
# version with a pre-release suffix (`-alpha-1`, `-rc.1`) makes a pre-release. Only a stable DRE
# release is GitHub's "latest".
#
# Assets, per platform (`<os>-<arch>` as in the index: macos-aarch64, linux-x86_64, ...):
#   dre-<version>-<platform>.tar.gz (.zip on Windows)    the dre CLI and its install receipt
#                                                       (dre-receipt.json), for install.sh
#   dre_cli-<pep440 version>-py3-none-<tag>.whl         the `dre-cli` wheels for PyPI
#   dre-plugin-<package>-<version>-<platform>.tar.gz     one plugin package (plugin releases)
# plus SHA256SUMS, and install.sh on DRE releases. An annotated tag's message is added to the
# release notes, e.g. "Needs the databricks plugin 1.2.0 or later".
#
# PyPI: the `pypi` job builds the wheels from the same binaries and attaches them to the release.
# It uploads them to PyPI only when the repository variable PYPI_PUBLISH is `true`, through
# trusted publishing (no token): PyPI trusts this workflow (`release.yml`) in the `pypi`
# environment as a publisher of `dre-cli`.
#
# Run by hand (Actions > Release > Run workflow, or `gh workflow run release.yml -f tag=v…`), it
# uploads the wheels already attached to that DRE release to PyPI, and builds and publishes
# nothing else. With `-f tag=registry` it only brings the registry index up to date.
#
# Dry run: `gh workflow run release.yml --ref <branch> -f tag=<tag> -f dry_run=true` runs the
# release of <tag> (a version not released yet is fine; the tag needn't exist) from that branch,
# up to everything that publishes: the security scan, the builds, checksums, `cargo publish
# --dry-run` and the wheels with their smoke test. It creates no release, uploads nothing and
# leaves crates.io, PyPI, the registry, Homebrew, Scoop and the site alone.

on:
  push:
    # Skills release separately; MCP binaries build privately and publish precompiled assets.
    tags: ["v*", "*-v[0-9]*", "!skills-v*", "!dre-mcp-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing DRE release whose attached wheels to upload to PyPI (e.g. v0.1.0), or `registry` to update the plugin index; with dry_run, the release to try (e.g. duckdb-v1.2.0)"
        required: true
      dry_run:
        description: "Build and check the release of `tag` from this branch without publishing anything"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  # The tag being released: the pushed tag, or the `tag` input of a manual run.
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  DRY_RUN: ${{ inputs.dry_run == true }}

# Read-only by default; a job that publishes asks for more itself.
permissions:
  contents: read

jobs:
  plan:
    name: Plan
    if: github.event_name == 'push' || inputs.dry_run
    runs-on: ubuntu-latest
    outputs:
      kind: ${{ steps.plan.outputs.kind }}
      package: ${{ steps.plan.outputs.package }}
      version: ${{ steps.plan.outputs.version }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      go: ${{ steps.plan.outputs.go }}
      lang: ${{ steps.plan.outputs.lang }}
      java: ${{ steps.plan.outputs.java }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: plan
        shell: bash  # with pipefail: a rejected tag fails here, not in the build
        run: python3 .github/scripts/release_plan.py "$TAG" | tee -a "$GITHUB_OUTPUT"
      # The PyPI and crates.io pages are built from the README: stale ones stop a core release
      # here, before anything is published.
      - name: Package pages match the README
        if: steps.plan.outputs.kind == 'core'
        run: python3 .github/scripts/package_readme.py check

  # Known vulnerabilities and licences (security.yml): a failure stops the release before the build.
  security:
    name: Security scan
    needs: plan
    uses: ./.github/workflows/security.yml

  build:
    name: Build ${{ needs.plan.outputs.package }} (${{ matrix.platform }})
    needs: [plan, security]
    if: needs.plan.outputs.lang != 'java'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: macos-aarch64, os: macos-latest, target: aarch64-apple-darwin, goos: darwin, goarch: arm64}
          # A macOS host cross-compiles to the other Mac architecture.
          - {platform: macos-x86_64, os: macos-latest, target: x86_64-apple-darwin, goos: darwin, goarch: amd64}
          # Ubuntu 22.04's glibc, so the binaries also run on older hosts such as Databricks
          # Runtime clusters (Ubuntu 22.04 up to DBR 16).
          - {platform: linux-x86_64, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, goos: linux, goarch: amd64}
          - {platform: linux-aarch64, os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, goos: linux, goarch: arm64}
          - {platform: windows-x86_64, os: windows-latest, target: x86_64-pc-windows-msvc, goos: windows, goarch: amd64}
          - {platform: windows-aarch64, os: windows-11-arm, target: aarch64-pc-windows-msvc, goos: windows, goarch: arm64}
    env:
      KIND: ${{ needs.plan.outputs.kind }}
      PACKAGE: ${{ needs.plan.outputs.package }}
      VERSION: ${{ needs.plan.outputs.version }}
      GO_DIR: ${{ needs.plan.outputs.go }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The runner's rustup, not a third-party action: the newest stable Rust.
      - if: needs.plan.outputs.go == ''
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: rustup toolchain install stable --profile minimal --target "$TARGET" && rustup default stable

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: needs.plan.outputs.go != ''
        with:
          go-version-file: ${{ needs.plan.outputs.go }}/go.mod
          # The newest patch release, with the standard library's latest security fixes.
          check-latest: true
          # No build cache in a release: a cache written by any other run can't reach its binaries.
          cache: false

      - name: Install OpenSSL headers
        if: runner.os == 'Linux' && needs.plan.outputs.go == ''
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      # Rust binaries carry the exact list of crates linked into them (`cargo auditable`), so the
      # SBOM reflects what's in the binary. Go binaries carry it already.
      # A prebuilt binary, checked against the action's pinned checksum, rather than a minute or two
      # of `cargo install` on every runner.
      - name: Install cargo-auditable
        if: needs.plan.outputs.go == ''
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-auditable@0.7.6

      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          ext=""; [[ "$RUNNER_OS" == Windows ]] && ext=".exe"
          out="target/${{ matrix.target }}/release"
          if [[ "$KIND" == core ]]; then
            cargo auditable build --release --locked -p dre-cli --bin dre --target ${{ matrix.target }}
          elif [[ -n "$GO_DIR" ]]; then
            mkdir -p "$out"
            go -C "$GO_DIR" build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "$PWD/$out/dre-plugin-$PACKAGE$ext" .
          else
            cargo auditable build --release --locked -p "dre-plugin-$PACKAGE" --bins --target ${{ matrix.target }}
          fi

      - name: Package
        shell: bash
        run: |
          ext=""; [[ "$RUNNER_OS" == Windows ]] && ext=".exe"
          bin="target/${{ matrix.target }}/release"
          mkdir dist
          suffix="$VERSION-${{ matrix.platform }}"
          if [[ "$KIND" == core ]]; then
            # The install receipt: `dre system update` reads it to know this copy is a direct
            # install it may replace. The wheel builder swaps in a `pypi` one.
            printf '{"schema": 1, "source": "release_archive", "version": "%s"}\n' "$VERSION" > "$bin/dre-receipt.json"
            if [[ -n "$ext" ]]; then
              (cd "$bin" && 7z a -bd "$GITHUB_WORKSPACE/dist/dre-$suffix.zip" dre.exe dre-receipt.json >/dev/null)
            else
              tar -C "$bin" -czf "dist/dre-$suffix.tar.gz" dre dre-receipt.json
            fi
          else
            tar -C "$bin" -czf "dist/dre-plugin-$PACKAGE-$suffix.tar.gz" "dre-plugin-$PACKAGE$ext"
          fi
          ls -l dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  build-jdbc:
    name: Build jdbc (${{ matrix.platform }})
    needs: [plan, security]
    if: needs.plan.outputs.lang == 'java'
    # Every JDK below is the exact Temurin release, checked before any build step uses it.
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: macos-aarch64, os: macos-latest, target: aarch64-apple-darwin}
          - {platform: macos-x86_64, os: macos-latest, target: x86_64-apple-darwin}
          - {platform: linux-x86_64, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu}
          - {platform: linux-aarch64, os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu}
          - {platform: windows-x86_64, os: windows-latest, target: x86_64-pc-windows-msvc}
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      JAVA_DIR: ${{ needs.plan.outputs.java }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use the runner's Java 17 to build
        shell: bash
        run: |
          case "$RUNNER_ARCH" in
            X64) java_home="JAVA_HOME_17_X64";;
            ARM64) java_home="JAVA_HOME_17_ARM64";;
            *) echo "unsupported runner architecture: $RUNNER_ARCH" >&2; exit 1;;
          esac
          test -n "${!java_home}" || { echo "$java_home is not set" >&2; exit 1; }
          echo "JAVA_HOME=${!java_home}" >> "$GITHUB_ENV"
          echo "${!java_home}/bin" >> "$GITHUB_PATH"
          echo "BUILD_JAVA_HOME=${!java_home}" >> "$GITHUB_ENV"

      - name: Install Maven 3.9.11
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            https://archive.apache.org/dist/maven/maven-3/3.9.11/binaries/apache-maven-3.9.11-bin.tar.gz \
            -o "$RUNNER_TEMP/maven.tar.gz"
          echo "4b7195b6a4f5c81af4c0212677a32ee8143643401bc6e1e8412e6b06ea82beac  $RUNNER_TEMP/maven.tar.gz" \
            | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/maven"
          tar -xzf "$RUNNER_TEMP/maven.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/maven"

      - name: Install Rust for the Windows launcher
        if: runner.os == 'Windows'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: rustup toolchain install stable --profile minimal --target "$TARGET" && rustup default stable

      - name: Build, jlink and package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          case "$PLATFORM" in
            macos-aarch64)
              jdk_url="https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.20.1%2B1/OpenJDK17U-jdk_aarch64_mac_hotspot_17.0.20.1_1.tar.gz"
              jdk_sum="196d13ba5f10414bef7f6a05a9b3f00edacb18ebacef2b99485db9e2ee18f0e8";;
            macos-x86_64)
              jdk_url="https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.20.1%2B1/OpenJDK17U-jdk_x64_mac_hotspot_17.0.20.1_1.tar.gz"
              jdk_sum="c01975da12ed4235250ff891fe8bba73a9e73037d444b269c9d0922b5dbc8e0a";;
            linux-x86_64)
              jdk_url="https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.20.1%2B1/OpenJDK17U-jdk_x64_linux_hotspot_17.0.20.1_1.tar.gz"
              jdk_sum="3808d1d15e3ec6bd5b84057fb5d84c33d8a1536a258146bcea2e603fc726e08e";;
            linux-aarch64)
              jdk_url="https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.20.1%2B1/OpenJDK17U-jdk_aarch64_linux_hotspot_17.0.20.1_1.tar.gz"
              jdk_sum="457b57af8f9c93ec39080bb8c764f559dc8c89a6da1a39d718a400b7890d3e41";;
            windows-x86_64)
              jdk_url="https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.20.1%2B1/OpenJDK17U-jdk_x64_windows_hotspot_17.0.20.1_1.zip"
              jdk_sum="e53a79c3c3d86865bd7e787903884331068e71321714ffd44f145785affc7cb0";;
            *) echo "unsupported JDBC platform: $PLATFORM" >&2; exit 1;;
          esac
          "$RUNNER_TEMP/maven/bin/mvn" -B -f "$JAVA_DIR/pom.xml" package
          archive="$RUNNER_TEMP/${jdk_url##*/}"
          curl --fail --silent --show-error --location "$jdk_url" -o "$archive"
          if [[ "$RUNNER_OS" == Windows ]]; then
            actual="$(sha256sum "$archive" | cut -d' ' -f1)"
            [[ "$actual" == "$jdk_sum" ]] || { echo "checksum mismatch for $archive" >&2; exit 1; }
          else
            echo "$jdk_sum  $archive" | sha256sum --check -
          fi
          mkdir -p "$RUNNER_TEMP/temurin" "$RUNNER_TEMP/jdk"
          if [[ "$archive" == *.zip ]]; then
            7z x "$archive" -o"$RUNNER_TEMP/temurin" >/dev/null
          else
            tar -xzf "$archive" -C "$RUNNER_TEMP/temurin"
          fi
          release_file="$(find "$RUNNER_TEMP/temurin" -maxdepth 3 -type f -name release | head -1)"
          test -n "$release_file"
          jdk="$(dirname "$release_file")"
          grep -q '^JAVA_VERSION="17\.0\.20\.1"$' "$release_file"
          "$jdk/bin/java" -version
          "$jdk/bin/jdeps" --ignore-missing-deps --multi-release 17 --print-module-deps \
            "$JAVA_DIR/target/dre-plugin-jdbc.jar" > "$RUNNER_TEMP/modules"
          test "$(cat "$RUNNER_TEMP/modules")" = "java.base,java.desktop,java.sql,jdk.jfr,jdk.unsupported"
          "$jdk/bin/jlink" --add-modules java.base,java.desktop,java.sql,jdk.jfr,jdk.unsupported,java.naming,java.management \
            --strip-debug --no-header-files --no-man-pages --compress=2 --output "$RUNNER_TEMP/jdk/runtime"
          cp "$jdk/NOTICE" "$RUNNER_TEMP/jdk/runtime/NOTICE"
          cp "$jdk/legal/java.base/LICENSE" "$RUNNER_TEMP/jdk/runtime/LICENSE"
          launcher=java/jdbc/launcher/dre-plugin-jdbc
          if [[ "$PLATFORM" == windows-* ]]; then
            rustc --edition=2021 --target "$TARGET" java/jdbc/launcher/dre-plugin-jdbc.rs \
              -o "$RUNNER_TEMP/dre-plugin-jdbc.exe"
            launcher="$RUNNER_TEMP/dre-plugin-jdbc.exe"
          fi
          mkdir -p dist
          python3 .github/scripts/package_jdbc.py \
            --output "dist/dre-plugin-jdbc-$VERSION-$PLATFORM.tar.gz" \
            --version "$VERSION" --platform "$PLATFORM" \
            --jar "$JAVA_DIR/target/dre-plugin-jdbc.jar" \
            --runtime "$RUNNER_TEMP/jdk/runtime" --launcher "$launcher"

      - name: Smoke test the packaged launcher
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: python3 java/jdbc/test_package.py

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-jdbc-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  # A CycloneDX SBOM for every archive, and signed build provenance (GitHub artifact attestations,
  # through Sigstore) for the archives and their SBOMs. Its own job, so only it can sign.
  attest:
    name: SBOMs and provenance
    needs: [plan, build, build-jdbc]
    if: >-
      always() && (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      (needs.build-jdbc.result == 'success' || needs.build-jdbc.result == 'skipped') &&
      !(needs.build.result == 'skipped' && needs.build-jdbc.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Install syft
        run: |
          curl -fsSL -o "$RUNNER_TEMP/syft.tar.gz" https://github.com/anchore/syft/releases/download/v1.52.0/syft_1.52.0_linux_amd64.tar.gz
          echo "caeedb81fb0491615f1ebd1761e4145d41ee86dd2cc7bf80669f9f5ad9d6133d  $RUNNER_TEMP/syft.tar.gz" | sha256sum -c -
          tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/syft.tar.gz" syft

      - name: SBOMs
        run: |
          for f in dist/*.tar.gz dist/*.zip; do
            [[ -e "$f" ]] || continue
            "$RUNNER_TEMP/syft" scan "$f" -q -o "cyclonedx-json=$f.cdx.json"
          done
          ls -l dist

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: env.DRY_RUN != 'true'
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.cdx.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sboms
          path: dist/*.cdx.json
          if-no-files-found: error

  publish:
    name: Publish the release
    # After crates.io (DRE releases): a publish there can't be undone, so if it fails, no GitHub
    # release points people at crates that don't exist.
    needs: [plan, build, build-jdbc, attest, crates]
    if: >-
      always() && (needs.build.result == 'success' || needs.build-jdbc.result == 'success') &&
      needs.attest.result == 'success' &&
      (needs.crates.result == 'success' || needs.crates.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      KIND: ${{ needs.plan.outputs.kind }}
      PACKAGE: ${{ needs.plan.outputs.package }}
      VERSION: ${{ needs.plan.outputs.version }}
      PRERELEASE: ${{ needs.plan.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sboms
          path: dist

      - name: Checksums
        working-directory: dist
        run: |
          [[ "$KIND" == core ]] && cp ../install.sh .
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Dry run
        if: env.DRY_RUN == 'true'
        run: |
          echo "Dry run: would create the release $TAG with these assets:"
          ls -l dist

      - name: Create the release
        if: env.DRY_RUN != 'true'
        run: |
          git fetch --force --tags origin
          # An annotated tag's message goes into the notes (a lightweight tag has none).
          message=""
          if [[ "$(git cat-file -t "$TAG")" == tag ]]; then
            message="$(git for-each-ref "refs/tags/$TAG" --format='%(contents)')"
          fi
          flags=(--verify-tag)
          [[ "$PRERELEASE" == true ]] && flags+=(--prerelease)
          if [[ "$KIND" == core ]]; then
            [[ "$PRERELEASE" == true ]] || flags+=(--latest)
            title="DRE $TAG"
            notes="Install: \`curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/install.sh | sh\`, \`pip install dre-cli\`, or see the README. Plugins are released separately (\`<package>-v<version>\` releases) and installed by \`dre\` on demand."
            # Changes since the previous DRE release, not since the last plugin release.
            flags+=(--generate-notes)
            prev="$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null || true)"
            [[ -n "$prev" ]] && flags+=(--notes-start-tag "$prev")
          else
            flags+=(--latest=false)
            title="$PACKAGE plugin $VERSION"
            notes="The \`$PACKAGE\` plugin package, $VERSION. \`dre\` installs it on demand for projects that declare \`$PACKAGE\` under \`plugins:\`; \`dre plugin update $PACKAGE\` moves a project to it."
          fi
          notes="$notes"$'\n\n'"Each archive has a CycloneDX SBOM (\`<archive>.cdx.json\`) and signed build provenance: \`gh attestation verify <archive> --repo ${{ github.repository }}\`."
          [[ -n "$message" ]] && notes="$message"$'\n\n'"$notes"
          gh release create "$TAG" dist/* "${flags[@]}" --title "$title" --notes "$notes"

  registry:
    name: Update the registry index
    needs: [plan, publish]
    # After a plugin release, or run by hand with `-f tag=registry`.
    if: >-
      always() && !inputs.dry_run &&
      ((needs.publish.result == 'success' && needs.plan.outputs.kind == 'plugin') ||
       (github.event_name == 'workflow_dispatch' && inputs.tag == 'registry'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One index update at a time: each rewrites packages.json. GitHub cancels all but the last
    # queued one when several plugin tags are pushed together; that's fine, since each update adds
    # every plugin release the index is missing (.github/scripts/registry_index.py).
    concurrency: registry
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Update the registry index
        run: |
          if ! gh release view registry >/dev/null 2>&1; then
            gh release create registry --prerelease --latest=false --target "$GITHUB_SHA" \
              --title "Plugin registry" \
              --notes "The plugin package index that \`dre\` reads (packages.json). See docs/registry.md. Not a release of DRE."
          fi
          # packages.json is the index of plugin packages. index.json, the plugin index DRE
          # 0.0.1-alpha-6 and earlier read, is left as it is, so those versions keep working.
          gh release download registry -p packages.json -D registry || true
          python3 .github/scripts/registry_index.py registry/packages.json "$GITHUB_REPOSITORY" > packages.json
          gh release upload registry packages.json --clobber

  package-managers:
    name: Homebrew and Scoop
    needs: [plan, publish]
    if: needs.plan.outputs.kind == 'core' && !inputs.dry_run
    # Tested for every DRE release; pushed to the tap and bucket from release candidates on.
    uses: ./.github/workflows/package-managers.yml
    with:
      tag: ${{ github.ref_name }}
      push: ${{ !contains(needs.plan.outputs.version, '-alpha') }}
    secrets:
      PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}

  site:
    name: Rebuild getdre.com
    # A stable DRE release changes what the docs, plugin catalogue and changelog show.
    needs: [plan, publish, package-managers]
    if: needs.plan.outputs.kind == 'core' && needs.plan.outputs.prerelease != 'true' && !inputs.dry_run
    runs-on: ubuntu-latest
    steps:
      - name: Call the Cloudflare Pages deploy hook
        env:
          HOOK: ${{ secrets.SITE_DEPLOY_HOOK }}
        run: |
          if [[ -z "$HOOK" ]]; then
            echo "::warning::SITE_DEPLOY_HOOK is not set; getdre.com was not rebuilt"
            exit 0
          fi
          curl -fsS -X POST "$HOOK" >/dev/null

  crates:
    name: Publish to crates.io
    needs: [plan, build]
    if: needs.plan.outputs.kind == 'core'
    runs-on: ubuntu-latest
    # Trusted publishing: crates.io trusts this workflow (release.yml in get-dre/dre) for
    # dre-protocol, dre-core and dre-cli, and hands it a short-lived token. No stored secret.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The runner's rustup, not a third-party action: the newest stable Rust.
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        if: env.DRY_RUN != 'true'
        id: auth
      # Packages and verifies the crates whose version isn't on crates.io yet, together, so dre-core
      # can build against an unpublished dre-protocol.
      - name: Dry run
        if: env.DRY_RUN == 'true'
        run: |
          new=()
          for crate in dre-protocol dre-core dre-cli; do
            version="$(cargo metadata --no-deps --format-version 1 | jq -r --arg c "$crate" '.packages[] | select(.name == $c) | .version')"
            if curl -sfo /dev/null -A "dre-release (github.com/${{ github.repository }})" "https://crates.io/api/v1/crates/$crate/$version"; then
              echo "$crate $version is already on crates.io"
            else
              new+=(-p "$crate")
            fi
          done
          if [[ ${#new[@]} -gt 0 ]]; then cargo publish --dry-run --locked "${new[@]}"; fi
      # dre-protocol has its own version: it's published only when that version is new. dre-core
      # and dre-cli carry DRE's. `cargo publish` waits for each to be in the index before the next.
      - name: Publish dre-protocol, dre-core and dre-cli
        if: env.DRY_RUN != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          for crate in dre-protocol dre-core dre-cli; do
            version="$(cargo metadata --no-deps --format-version 1 | jq -r --arg c "$crate" '.packages[] | select(.name == $c) | .version')"
            if curl -sfo /dev/null -A "dre-release (github.com/${{ github.repository }})" "https://crates.io/api/v1/crates/$crate/$version"; then
              echo "$crate $version is already on crates.io"
            else
              cargo publish -p "$crate" --locked
            fi
          done

  pypi:
    name: PyPI wheels
    needs: [plan, publish]
    if: needs.plan.outputs.kind == 'core'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Build the wheels
        run: python3 .github/scripts/build_wheels.py --dist dist --version "${TAG#v}" --out wheels

      - name: Smoke test the Linux wheel
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .github/scripts/smoke_wheel.sh

      - name: Attach the wheels to the release
        if: env.DRY_RUN != 'true'
        run: gh release upload "$TAG" wheels/*.whl

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels
          path: wheels/*.whl

  # The wheels' SBOMs and provenance, as for the archives (PyPI adds its own attestations on
  # upload through Trusted Publishing).
  attest-wheels:
    name: Wheel SBOMs and provenance
    needs: [pypi, release-wheels]
    if: always() && (needs.pypi.result == 'success' || needs.release-wheels.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels
          path: wheels

      - name: Install syft
        run: |
          curl -fsSL -o "$RUNNER_TEMP/syft.tar.gz" https://github.com/anchore/syft/releases/download/v1.52.0/syft_1.52.0_linux_amd64.tar.gz
          echo "caeedb81fb0491615f1ebd1761e4145d41ee86dd2cc7bf80669f9f5ad9d6133d  $RUNNER_TEMP/syft.tar.gz" | sha256sum -c -
          tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/syft.tar.gz" syft

      - name: SBOMs
        run: for f in wheels/*.whl; do "$RUNNER_TEMP/syft" scan "$f" -q -o "cyclonedx-json=$f.cdx.json"; done

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: env.DRY_RUN != 'true'
        with:
          subject-path: |
            wheels/*.whl
            wheels/*.cdx.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-sboms
          path: wheels/*.cdx.json

  wheel-sboms:
    name: Attach the wheels' SBOMs
    needs: [attest-wheels]
    # always(): attest-wheels may follow a skipped `pypi` (a manual run for an existing release).
    if: always() && needs.attest-wheels.result == 'success' && (github.event_name == 'push' || !inputs.dry_run)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheel-sboms
          path: sboms
      - run: gh release upload "$TAG" sboms/*.cdx.json -R "$GITHUB_REPOSITORY"

  release-wheels:
    name: Wheels from ${{ inputs.tag }}
    if: github.event_name == 'workflow_dispatch' && inputs.tag != 'registry' && !inputs.dry_run
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The wheels attached to the release; when there are none (their build failed after the
      # release was published), built here from the release's archives, tested and attached.
      - name: Download the release's wheels
        run: |
          mkdir wheels
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p 'dre_cli-*.whl' -D wheels || true
          if ! ls wheels/*.whl >/dev/null 2>&1; then
            gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "dre-${TAG#v}-*" -D dist
            python3 .github/scripts/build_wheels.py --dist dist --version "${TAG#v}" --out wheels
            GITHUB_TOKEN="$GH_TOKEN" .github/scripts/smoke_wheel.sh
            gh release upload "$TAG" wheels/*.whl -R "$GITHUB_REPOSITORY"
          fi
          ls -l wheels
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels
          path: wheels/*.whl

  pypi-upload:
    name: Upload to PyPI
    needs: [pypi, release-wheels]
    # `always()`: on a manual run `pypi` is skipped, which would otherwise skip this too.
    if: >-
      always() && vars.PYPI_PUBLISH == 'true' && !inputs.dry_run &&
      (needs.pypi.result == 'success' || needs.release-wheels.result == 'success')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels
          path: wheels
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: wheels
