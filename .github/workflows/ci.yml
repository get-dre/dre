name: CI

# Only for changes that can affect the build or tests. Docs, the licence and release-only files
# don't run it; a change that mixes them with code runs everything.
on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".github/workflows/release.yml"
      - ".github/scripts/**"
      - "skills/**"
      - ".claude-plugin/**"
      - ".github/workflows/skills*.yml"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".github/workflows/release.yml"
      - ".github/scripts/**"
      - "skills/**"
      - ".claude-plugin/**"
      - ".github/workflows/skills*.yml"
  # By hand, e.g. to run macOS and Windows on a branch: `gh workflow run ci.yml --ref <branch>`.
  workflow_dispatch:

# A new push to a pull request cancels its older run. Runs on master all finish: they save the
# build caches every other run restores.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Line tables only: backtraces keep file and line numbers, and the build cache is much smaller.
  # Set here rather than in Cargo.toml, so local builds keep full debug info.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

# Read-only by default; a job that publishes asks for more itself.
permissions:
  contents: read

jobs:
  jdbc:
    # The development Java package; release packaging is checked in release.yml.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      oracle:
        image: container-registry.oracle.com/database/free:23.26.3.0-lite@sha256:cf540c3fa190d7cffad08c491652ac07fc70314e510f6b87890449517d565e94
        env:
          ORACLE_PWD: DreFixture39_x
        ports: ["1521:1521"]
        options: --shm-size=1g --health-interval=10s --health-retries=30 --health-start-period=30s
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04@sha256:4402d880dd4c34bfa7d8705e56a86cd6c88da80a1f6bbbe741f999e76264a090
        env:
          ACCEPT_EULA: Y
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: DreFixture39_x!
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -b -C -S localhost -U sa -P 'DreFixture39_x!' -Q 'SELECT 1'"
          --health-interval 10s
          --health-retries 30
          --health-start-period 30s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use the runner's Java 17
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
      - run: mvn -B -f java/jdbc/pom.xml package
      - run: python3 java/jdbc/test_protocol.py
      - name: Prepare database fixtures and pinned user-supplied drivers
      - run: python3 java/jdbc/test_package.py
      - name: Check the committed Java describe.json
        env:
          DRE_TEST_JDBC_JAR: ${{ github.workspace }}/java/jdbc/target/dre-plugin-jdbc.jar
        run: cargo test -p dre-cli --test describe_json
      - name: Prepare the synthetic Oracle account and user-supplied test driver
        env:
          ORACLE_CONTAINER: ${{ job.services.oracle.id }}
          SQLSERVER_CONTAINER: ${{ job.services.sqlserver.id }}
        run: |
          docker exec -i "$ORACLE_CONTAINER" sqlplus -s / as sysdba < java/jdbc/tests/oracle-setup.sql
          docker exec -i "$SQLSERVER_CONTAINER" /opt/mssql-tools18/bin/sqlcmd -b -C -S localhost -U sa -P 'DreFixture39_x!' < java/jdbc/tests/sqlserver-setup.sql
          curl --fail --silent --show-error --location \
            https://repo.maven.apache.org/maven2/com/oracle/database/jdbc/ojdbc11/23.26.3.0.0/ojdbc11-23.26.3.0.0.jar \
            -o "$RUNNER_TEMP/ojdbc11.jar"
          curl --fail --silent --show-error --location \
            https://repo.maven.apache.org/maven2/com/microsoft/sqlserver/mssql-jdbc/13.6.1.jre11/mssql-jdbc-13.6.1.jre11.jar \
            -o "$RUNNER_TEMP/mssql-jdbc.jar"
          echo "4f470d23dfdf187ece2d1f9feb33d9dbd2230051b9c9676456727692a1b97d5e  $RUNNER_TEMP/mssql-jdbc.jar" | sha256sum --check
          echo "DRE_TEST_JDBC_BIN=$GITHUB_WORKSPACE/java/jdbc/dre-plugin-jdbc" >> "$GITHUB_ENV"
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v2-rust
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Run Oracle protocol conformance and typed fixture
        run: cargo test -p dre-protocol --test jdbc
        env:
          DRE_TEST_JDBC_DATABASE: oracle
          DRE_TEST_JDBC_URL: jdbc:oracle:thin:@//127.0.0.1:1521/FREEPDB1
          DRE_TEST_JDBC_JAR: ${{ runner.temp }}/ojdbc11.jar
          DRE_TEST_JDBC_USER: dre_fixture
          DRE_TEST_JDBC_PASSWORD: DreFixture39_x
      - name: Run SQL Server protocol conformance and typed fixture
        run: cargo test -p dre-protocol --test jdbc
        env:
          DRE_TEST_JDBC_DATABASE: sqlserver
          DRE_TEST_JDBC_URL: jdbc:sqlserver://127.0.0.1:1433
          DRE_TEST_JDBC_JAR: ${{ runner.temp }}/mssql-jdbc.jar
          DRE_TEST_JDBC_USER: dre_fixture
          DRE_TEST_JDBC_PASSWORD: DreFixture39_x!
      - run: cargo build -p dre-cli -p dre-plugin-xlsx
      - name: Run catalog through the existing CLI contract
        run: |
          DRE_BIN="$GITHUB_WORKSPACE/target/debug/dre" \
          python3 java/jdbc/test_catalog.py
      - name: Run Oracle SQL through the CLI into a checked workbook
        run: |
          DRE_BIN="$GITHUB_WORKSPACE/target/debug/dre" \
          DRE_TEST_XLSX_BIN="$GITHUB_WORKSPACE/target/debug/dre-plugin-xlsx" \
          DRE_TEST_JDBC_DATABASE=oracle \
          DRE_TEST_JDBC_URL='jdbc:oracle:thin:@//127.0.0.1:1521/FREEPDB1' \
          DRE_TEST_JDBC_JAR="$RUNNER_TEMP/ojdbc11.jar" \
          DRE_TEST_JDBC_USER=dre_fixture \
          DRE_TEST_JDBC_PASSWORD=DreFixture39_x \
          python3 java/jdbc/test_jdbc_report.py
      - name: Run SQL Server SQL through the CLI into a checked workbook
        run: |
          DRE_BIN="$GITHUB_WORKSPACE/target/debug/dre" \
          DRE_TEST_XLSX_BIN="$GITHUB_WORKSPACE/target/debug/dre-plugin-xlsx" \
          DRE_TEST_JDBC_DATABASE=sqlserver \
          DRE_TEST_JDBC_URL='jdbc:sqlserver://127.0.0.1:1433' \
          DRE_TEST_JDBC_JAR="$RUNNER_TEMP/mssql-jdbc.jar" \
          DRE_TEST_JDBC_USER=dre_fixture \
          DRE_TEST_JDBC_PASSWORD='DreFixture39_x!' \
          python3 java/jdbc/test_jdbc_report.py

  plugin-versions:
    # A warning, never a failure, for a plugin whose code changed without a version bump.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: python3 .github/scripts/plugin_versions.py "origin/$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref }}

  schema-docs:
    # The YAML reference pages are generated from the JSON Schemas in docs/schemas/; every page
    # has a section (docs/sections.json), and docs/README.md and the previous/next links match.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 .github/scripts/schema_docs.py check
      - run: python3 .github/scripts/test_registry_index.py
      - run: python3 .github/scripts/test_docs_sections.py
      - run: python3 .github/scripts/docs_sections.py check
      - run: python3 .github/scripts/plugin_pages.py check
      - run: python3 .github/scripts/check_links.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The runner's rustup, not a third-party action: the newest stable Rust.
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      # Every Rust cache is saved only from master, so PRs can't evict master's caches or each
      # other's, and every run (PRs included) restores master's. The key follows Cargo.lock, the
      # toolchain and CARGO_* variables, not Cargo.toml's [profile] settings: after changing those,
      # bump prefix-key in all three jobs (lint, test-linux, test), or master keeps its stale cache.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v2-rust
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The Go plugin packages (databricks, bigquery, snowflake, clickhouse) and their shared
      # protocol module, each its own Go module.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/plugin/go.mod
          cache-dependency-path: go/*/go.sum
      - run: test -z "$(gofmt -l go)" || { gofmt -l go; exit 1; }
      - run: for m in go/*/; do (cd "$m" && go vet ./...) || exit 1; done

  test-linux:
    # Every test on Linux, the plugin integration tests among them, against local emulators (each
    # skips itself when its service's env var is unset). Pull requests run only this job's tests:
    # macOS and Windows run on master (the `test` job). On master it only builds, to save the
    # cache: the pull request already ran these tests on the same code. Docker Hub images come
    # through Google's mirror of it (mirror.gcr.io): the same digests, without Docker Hub's pull
    # limit for shared runners.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: dre
          POSTGRES_PASSWORD: dre
          POSTGRES_DB: dre
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U dre" --health-interval 5s --health-retries 20
      s3:
        image: mirror.gcr.io/adobe/s3mock:latest@sha256:ab01a6946750f451ca215a47e91030695b260e4003b8a5a6201d25029b8fca92
        ports: ["9090:9090"]
      clickhouse:
        image: mirror.gcr.io/clickhouse/clickhouse-server:26.8.28.14@sha256:63e02621435cde1146ab0fde66057091ee75b312d12917c0109a6a0c99bc7ce1
        env:
          CLICKHOUSE_USER: dre
          CLICKHOUSE_PASSWORD: dre
        ports: ["8123:8123", "9000:9000"]
        options: >-
          --health-cmd "clickhouse-client --user dre --password dre --query 'SELECT 1'"
          --health-interval 5s --health-retries 20
      mailpit:
        image: mirror.gcr.io/axllent/mailpit:latest@sha256:b68349e3a014b90c5610bfb26b2ae36f3892d7b8cf25ee140c6c71c98d2fcf48
        env:
          MP_SMTP_AUTH_ACCEPT_ANY: "1"
          MP_SMTP_AUTH_ALLOW_INSECURE: "1"
        ports: ["1025:1025", "8025:8025"]
    env:
      RUN_TESTS: ${{ github.event_name != 'push' }}
      # sccache caches each compiled unit, Rust and the C/C++ inside crates (DuckDB, aws-lc), in
      # GitHub's cache, keyed by its inputs. It still hits when Cargo.lock changes and the
      # whole-target cache below misses (a cold build: 10 minutes; with sccache: 3). cc-rs uses
      # RUSTC_WRAPPER for C/C++ when it's sccache.
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      DRE_TEST_POSTGRES: localhost:5432
      DRE_TEST_S3_ENDPOINT: http://localhost:9090
      DRE_TEST_AZURITE_ENDPOINT: http://localhost:10000
      DRE_TEST_GCS_ENDPOINT: http://localhost:4443
      DRE_TEST_SFTP: localhost:2222
      DRE_TEST_FTP: 127.0.0.1:2121
      DRE_TEST_FTPS: 127.0.0.1:2990
      DRE_TEST_SMTP: localhost:1025
      DRE_TEST_MAILPIT_API: http://localhost:8025
      DRE_TEST_BIGQUERY_EMULATOR: http://localhost:9050
      DRE_TEST_CLICKHOUSE_HTTP: localhost:8123
      DRE_TEST_CLICKHOUSE_NATIVE: localhost:9000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start emulators that need arguments
        if: env.RUN_TESTS == 'true'
        run: |
          ssh-keygen -q -t ed25519 -N "" -f "$RUNNER_TEMP/id_test"
          echo "DRE_TEST_SFTP_KEY=$RUNNER_TEMP/id_test" >> "$GITHUB_ENV"
          ssh-keygen -q -t ecdsa -N "" -f "$RUNNER_TEMP/id_ecdsa"
          echo "DRE_TEST_SFTP_ECDSA_KEY=$RUNNER_TEMP/id_ecdsa" >> "$GITHUB_ENV"
          docker run -d -p 4443:4443 mirror.gcr.io/fsouza/fake-gcs-server:latest@sha256:797ce226d62f947c009dc40246b30cfb456b8473d8241407f9d6f2c04e4d69ef -scheme http -port 4443 \
            -public-host localhost:4443 -external-url http://localhost:4443
          docker run -d -p 2222:22 -v "$RUNNER_TEMP/id_test.pub:/home/dre/.ssh/keys/id_test.pub:ro" \
            -v "$RUNNER_TEMP/id_ecdsa.pub:/home/dre/.ssh/keys/id_ecdsa.pub:ro" \
            mirror.gcr.io/atmoz/sftp:latest@sha256:0960390462a4441dbb63698d7c185b76a41ffcee7b78ff4adf275f3e66f9c475 dre:dre-pass:1001::upload
          docker run -d -p 10000:10000 mcr.microsoft.com/azure-storage/azurite:latest@sha256:830430c1da1a2d537e08f3e6764dd1f5ae00cf0346bcaf625b968ec3f0971fd5 \
            azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck
          docker run -d -p 9050:9050 ghcr.io/goccy/bigquery-emulator:latest@sha256:f4e428d265a93dc5ce36c294e1c584c7c9b384117d47ab8ddbb63d8d50b7f393 --project=dre-test --dataset=shop
          # The image's own start runs vsftpd in the background and keeps the container alive only
          # while the pid it records exists. If the readiness check below connects as vsftpd
          # starts, that pid can be the check's session process, and the container exits when the
          # check disconnects. So give it a command: it still creates the users, then runs vsftpd
          # in the foreground (`-obackground=NO` must follow the config file to override it).
          vsftpd="vsftpd /etc/vsftpd/vsftpd.conf -obackground=NO -opasv_address=127.0.0.1"
          docker run -d -p 2121:21 -p 30000-30009:30000-30009 -e USERS="dre|dre-pass" \
            mirror.gcr.io/delfer/alpine-ftp-server:latest@sha256:60bb774d8408d9d4d5c74d05d1c086a34ce192c6c1a142ffac268cac0dbc6fac $vsftpd -opasv_min_port=30000 -opasv_max_port=30009
          # Explicit FTPS with vsftpd's defaults, which require TLS session reuse on data
          # connections, and a self-signed certificate.
          mkdir -p "$RUNNER_TEMP/ftps"
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj "/CN=localhost" \
            -keyout "$RUNNER_TEMP/ftps/server.key" -out "$RUNNER_TEMP/ftps/server.crt" 2>/dev/null
          chmod 644 "$RUNNER_TEMP/ftps/server.key"
          docker run -d -p 2990:21 -p 30010-30019:30010-30019 -e USERS="dre|dre-pass" \
            -v "$RUNNER_TEMP/ftps:/certs:ro" mirror.gcr.io/delfer/alpine-ftp-server:latest@sha256:60bb774d8408d9d4d5c74d05d1c086a34ce192c6c1a142ffac268cac0dbc6fac \
            $vsftpd -opasv_min_port=30010 -opasv_max_port=30019 \
            -orsa_cert_file=/certs/server.crt -orsa_private_key_file=/certs/server.key \
            -ossl_enable=YES -oallow_anon_ssl=NO -oforce_local_data_ssl=YES \
            -oforce_local_logins_ssl=YES -ossl_tlsv1=NO -ossl_sslv2=NO -ossl_sslv3=NO \
            -ossl_ciphers=HIGH
          # Wait until each emulator answers, rather than a fixed sleep. A bare TCP connect isn't
          # enough: Docker's port proxy accepts on the host before the container listens, so read
          # each server's greeting (or make an HTTP request), and fail with its logs if it never
          # comes up.
          ready() {
            case $1 in
              2222) timeout 2 bash -c 'exec 3<>/dev/tcp/127.0.0.1/2222; read -r l <&3; [[ $l == SSH-* ]]' ;;
              2121|2990) timeout 2 bash -c "exec 3<>/dev/tcp/127.0.0.1/$1; read -r l <&3; [[ \$l == 220* ]]" ;;
              *) curl -s -o /dev/null --max-time 2 "http://127.0.0.1:$1/" ;;
            esac
          }
          for port in 4443 2222 10000 2121 2990 9050; do
            for i in $(seq 60); do
              ready "$port" 2>/dev/null && break
              if [ "$i" = 60 ]; then
                echo "::error::emulator on port $port isn't ready after 60s"
                docker ps -a; docker logs "$(docker ps -aq --filter "publish=$port")"
                exit 1
              fi
              sleep 1
            done
          done
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/plugin/go.mod
          cache-dependency-path: go/*/go.sum
      # Postgres and ClickHouse with TLS behind an SSH bastion, for the postgres and clickhouse
      # plugins' tunnel tests.
      - name: Start the SSH bastion
        if: env.RUN_TESTS == 'true'
        run: .github/scripts/ssh_bastion.sh "$RUNNER_TEMP/bastion" "$RUNNER_TEMP/id_test" >> "$GITHUB_ENV"
      # Every Go module; bigquery and clickhouse against their emulators (and through the bastion).
      - name: Go tests
        if: env.RUN_TESTS == 'true'
        run: for m in go/*/; do (cd "$m" && go test ./...) || exit 1; done
      # The Go packages; the Rust tests check them through the same host code core uses.
      - name: Build the Go packages
        run: |
          dir="$RUNNER_TEMP/go-plugins"
          mkdir -p "$dir"
          for p in databricks bigquery snowflake clickhouse; do
            (cd "go/$p" && go build -o "$dir/dre-plugin-$p" .) || exit 1
          done
          echo "DRE_TEST_GO_PLUGINS=$dir" >> "$GITHUB_ENV"
      # The runner's rustup, not a third-party action: the newest stable Rust.
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v2-rust
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: nextest
      # Build the plugins first: otherwise each test process builds them (DuckDB from C++
      # source) into an uncached directory, and the tests sit at SLOW for many minutes.
      - run: cargo build --workspace --bins
      # On master: build the tests for the cache, run none.
      - if: env.RUN_TESTS != 'true'
        run: cargo nextest run --workspace --no-run
      # nextest runs test binaries in parallel (cargo test runs them one at a time), each test in
      # its own process. Locally, `cargo test` runs the same tests. --no-fail-fast runs every
      # test even after a failure, so one failure can't hide others.
      - if: env.RUN_TESTS == 'true'
        run: cargo nextest run --workspace --no-fail-fast
        env:
          DRE_TEST_PREBUILT_BINS: "1"
      - name: Validate and run public examples against this build
        if: env.RUN_TESTS == 'true'
        run: python .github/scripts/check_examples.py --dre target/debug/dre --plugins-dir target/debug
      # nextest doesn't run doctests.
      - if: env.RUN_TESTS == 'true'
        run: cargo test --workspace --doc

  test:
    # macOS and Windows: on master (after the pull request's Linux run) and by hand, not on pull
    # requests. Releases are tagged on master, so a tagged commit has passed them.
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The runner's rustup, not a third-party action: the newest stable Rust.
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v2-rust
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/plugin/go.mod
          cache-dependency-path: go/*/go.sum
      - name: Go tests
        shell: bash
        run: for m in go/*/; do (cd "$m" && go test ./...) || exit 1; done
      # The Go packages; the Rust tests check them through the same host code core uses.
      - name: Build the Go packages
        shell: bash
        run: |
          ext=""; [[ "$RUNNER_OS" == "Windows" ]] && ext=".exe"
          dir="$RUNNER_TEMP/go-plugins"
          mkdir -p "$dir"
          for p in databricks bigquery snowflake clickhouse; do
            (cd "go/$p" && go build -o "$dir/dre-plugin-$p$ext" .) || exit 1
          done
          echo "DRE_TEST_GO_PLUGINS=$dir" >> "$GITHUB_ENV"
      - run: cargo build --workspace --bins
      # nextest runs test binaries in parallel (cargo test runs them one at a time), each test in
      # its own process. Locally, `cargo test` runs the same tests. --no-fail-fast runs every
      # test even after a failure, so one failure can't hide others.
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: nextest
      - run: cargo nextest run --workspace --no-fail-fast
        env:
          DRE_TEST_PREBUILT_BINS: "1"
      - name: Validate and run public examples against this build
        shell: bash
        run: |
          ext=""; [[ "$RUNNER_OS" == "Windows" ]] && ext=".exe"
          python .github/scripts/check_examples.py --dre "target/debug/dre$ext" --plugins-dir target/debug
      # nextest doesn't run doctests.
