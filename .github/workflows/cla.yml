name: CLA

# Asks every pull request author to sign CLA.md once, and fails until they have. Signatures are
# kept in signatures/cla.json on the `cla-signatures` branch, which must exist: the bot
# creates the file but not the branch.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened, closed]

permissions: {}

jobs:
  cla:
    # Writes signatures to the cla-signatures branch, comments on and sets the status of the PR.
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    if: >
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request && (
        github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    runs-on: ubuntu-latest
    steps:
      # Only the protected default branch supplies code; never check out the PR head.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          persist-credentials: false
      - run: python3 .github/scripts/cla.py
        env:
          GH_TOKEN: ${{ github.token }}
