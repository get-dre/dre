name: Package pages

# The PyPI and crates.io pages are built from the README's intro (.github/scripts/package_readme.py).
# CI skips Markdown-only changes, so this runs on its own, for exactly the files that feed the pages.
on:
  push:
    branches: [master]
    paths:
      - "README.md"
      - "crates/dre-cli/README.md"
      - "crates/dre-cli/Cargo.toml"
      - ".github/package-description.json"
      - ".github/scripts/package_readme.py"
      - ".github/scripts/test_package_readme.py"
      - ".github/scripts/build_wheels.py"
      - ".github/workflows/package-pages.yml"
  pull_request:
    paths:
      - "README.md"
      - "crates/dre-cli/README.md"
      - "crates/dre-cli/Cargo.toml"
      - ".github/package-description.json"
      - ".github/scripts/package_readme.py"
      - ".github/scripts/test_package_readme.py"
      - ".github/scripts/build_wheels.py"
      - ".github/workflows/package-pages.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 .github/scripts/test_package_readme.py
      - run: python3 .github/scripts/package_readme.py check
