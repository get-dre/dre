# zizmor (the workflow security check in security.yml): findings accepted on purpose, each with
# its reason. Everything else fails CI.
rules:
  dangerous-triggers:
    ignore:
      # The CLA bot has to comment on and set a status for pull requests from forks. It runs no
      # code from the pull request; checkout uses the protected default branch only.
      - cla.yml
  artipacked:
    ignore:
      # The release job pushes the skills-latest branch with the checkout's token. It uploads no
      # artifacts.
      - skills-release.yml
  self-repository:
    # Local reusable workflows (`uses: ./.github/workflows/…`) run from the same commit already.
    disable: true
