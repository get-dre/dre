connections:
  jdbc_fixture:
    targets:
      dev:
        type: jdbc
        url: "{{ env_var('DRE_TEST_JDBC_URL') }}"
        driver_jars: "{{ env_var('DRE_TEST_JDBC_JAR') }}"
        properties:
          user: "{{ env_var('DRE_TEST_JDBC_USER', 'dre_fixture') }}"
          password: "{{ env_var('DRE_TEST_JDBC_PASSWORD') }}"
          databaseName: master
          encrypt: false
          trustServerCertificate: true
          arbitraryVendorCredential: "{{ env_var('DRE_TEST_JDBC_VENDOR_SECRET', 'VENDOR_PROPERTY_SENTINEL') }}"
