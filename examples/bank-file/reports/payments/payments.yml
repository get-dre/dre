queries: [payments]
output:
  # The bank's file: exact widths, no header, CRLF records. A line break in a value fails the run.
  - name: payments
    format: fixed_width
    extension: txt
    line_ending: "\r\n"
    line_breaks: error
    columns:
      - {name: account_id, width: 10}
      - {name: account_name, width: 20}
      - {name: amount, width: 10, align: right, pad: "0", decimals: 2, decimal_point: implied, sign: none}
      - {name: posted_on, width: 8, date_format: "%Y%m%d"}
    destination: {profile: local, path: out/payments.txt}
  # A readable copy for the payments team: a header record, Latin-1, Unix line endings, and a
  # line break in a value written as a space.
  - name: review
    format: fixed_width
    extension: txt
    header: true
    encoding: latin1
    line_ending: "\n"
    line_breaks: replace
    columns:
      - {name: account_id, width: 12, header: Account}
      - {name: account_name, width: 22, header: Name}
      - {name: amount, width: 12, align: right, decimals: 2, header: Amount}
      - {name: posted_on, width: 12, align: right, date_format: "%Y-%m-%d", header: Posted}
    destination: {profile: local, path: out/payments-review.txt}
