queries:
  - {query: seed, tab: false}
  - {query: prepare, tab: false}
  - query: summary
    tab_name: Summary
    columns:
      branch_product_bucket: {width: 42}
      accounts: {width: 12}
      balance: {format: '#,##0.00', width: 18}
  - query: detail
    tab_name: Detail
    autofit: true
    columns:
      balance: {format: '#,##0.00'}
  - {query: exceptions, tab_name: Exceptions}
output:
  - name: simple
    format: xlsx
    style:
      header: {fill: '#176B59', font_color: '#FFFFFF'}
      banded_rows: '#F0F5F3'
    destination: {profile: local, path: 'out/simple-{{ var("report_date") }}.xlsx'}
  - name: presentation
    format: xlsx
    template:
      file: templates/reporting.xlsx
      bindings:
        - {sheet: Summary, cell: A1, value: 'Acme overdue loans - {{ var("report_date") }}'}
        - {sheet: Summary, cell: B2, value: '{{ var("report_date") }}'}
        - {sheet: Summary, cell: D4, value: '2x (demo)'}
        - {sheet: Summary, query: summary, anchor: A4, header: true}
        - {sheet: Detail, query: detail, anchor: A1, header: true}
        - {sheet: Notes, cell: A1, value: 'Total'}
    destination: {profile: local, path: 'out/presentation-{{ var("report_date") }}.xlsx'}
