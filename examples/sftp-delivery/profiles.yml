connections:
  sample:
    targets:
      dev: {type: duckdb}
      prod: {type: duckdb}
destinations:
  # A password, with the server's host key pinned by its fingerprint.
  partner_sftp:
    targets:
      dev: {deliver: false}
      prod:
        type: sftp
        host: "{{ env_var('SFTP_HOST') }}"
        port: "{{ env_var('SFTP_PORT', '22') }}"
        username: "{{ env_var('SFTP_USERNAME') }}"
        password: "{{ env_var('DRE_SECRET_SFTP_PASSWORD') }}"
        host_key_fingerprint: "{{ env_var('SFTP_HOST_KEY_FINGERPRINT') }}"
  # A key file with a passphrase, the host key checked against a known_hosts file.
  bank_sftp:
    targets:
      dev: {deliver: false}
      prod:
        type: sftp
        host: "{{ env_var('BANK_SFTP_HOST', 'sftp.bank.example') }}"
        port: "{{ env_var('BANK_SFTP_PORT', '2222') }}"
        username: "{{ env_var('BANK_SFTP_USERNAME', 'acme_corp') }}"
        private_key_path: "{{ env_var('BANK_SFTP_KEY_FILE') }}"
        private_key_passphrase: "{{ env_var('DRE_SECRET_BANK_SFTP_KEY_PASSPHRASE') }}"
        known_hosts_path: "{{ env_var('BANK_SFTP_KNOWN_HOSTS') }}"
        connect_timeout: 30s
        timeout: 2m
        retries: 3
        retry_wait: 30s
        max_retry_wait: 10m
  # The key's text from a secret store (a CI secret, say), and RSA keys refused.
  archive_sftp:
    targets:
      dev: {deliver: false}
      prod:
        type: sftp
        host: "{{ env_var('ARCHIVE_SFTP_HOST', 'sftp.archive.example') }}"
        port: "{{ env_var('ARCHIVE_SFTP_PORT', '22') }}"
        username: "{{ env_var('ARCHIVE_SFTP_USERNAME', 'acme_corp') }}"
        private_key: "{{ env_var('DRE_SECRET_ARCHIVE_SFTP_KEY') }}"
        host_key_fingerprint: "{{ env_var('ARCHIVE_SFTP_HOST_KEY_FINGERPRINT') }}"
  # The keys in your SSH agent; a host missing from the selected known_hosts file is refused.
  ops_sftp:
    targets:
      dev: {deliver: false}
      prod:
        type: sftp
        host: "{{ env_var('OPS_SFTP_HOST', 'sftp.ops.internal') }}"
        port: "{{ env_var('OPS_SFTP_PORT', '22') }}"
        username: "{{ env_var('OPS_SFTP_USERNAME', env_var('USER', 'reporter')) }}"
        known_hosts_path: "{{ env_var('OPS_SFTP_KNOWN_HOSTS', '~/.ssh/known_hosts') }}"
        use_agent: true
        accept_unknown_host: false
