[package]
name = "dre-plugin-document"
description = "DRE format plugins: html and pdf documents from a Jinja HTML + CSS template"
version = "1.0.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
dre-protocol.workspace = true
# The template context, `var()`, `run.*`, the date functions and the number filters: core's own
# implementation, so a document template reads exactly what a message template reads.
dre-core.workspace = true
arrow.workspace = true
serde_json.workspace = true
minijinja.workspace = true
regex.workspace = true
chrono.workspace = true
# The PDF engine, behind `pdf::render_pdf` only. An exact revision of fulgur's main branch:
# repeated table headers landed after 0.40.0. Move to the first crates.io release that has them.
fulgur = { git = "https://github.com/fulgur-rs/fulgur", rev = "8392d70ff2f79866250246d1659ed7abc6583cbb" }
ttf-parser = "0.25"

[dev-dependencies]
tempfile.workspace = true
flate2 = "1.1"
