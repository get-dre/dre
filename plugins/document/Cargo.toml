[package]
name = "dre-plugin-document"
description = "DRE format plugins: html and pdf documents from a Jinja HTML + CSS template"
version = "1.6.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
dre-protocol.workspace = true
# The template context, `var()`, `run.*`, the date functions and the number filters: the same
# crate core builds its own templates from, so a document template reads exactly what a message
# template reads. The plugin never links dre-core.
dre-template.workspace = true
arrow.workspace = true
serde_json.workspace = true
minijinja.workspace = true
regex.workspace = true
chrono.workspace = true
# The released PDF engine includes repeated table headers.
fulgur = "0.41"
ttf-parser = "0.25"
# PDF open passwords (`password:`): AES-256 (PDF 2.0, R6) on fulgur's output. Already in the tree
# through fulgur. MIT.
lopdf = { version = "0.47", default-features = false }
# The random file key and owner password. MIT or Apache-2.0.
getrandom = "0.4"

[dev-dependencies]
# Tests only: they drive the plugin through core's host, as `dre` does.
dre-core.workspace = true
dre-plugin-host.workspace = true
tempfile.workspace = true
flate2 = "1.1"
lopdf = { version = "0.47", default-features = false }
