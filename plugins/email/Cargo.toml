[package]
name = "dre-plugin-email"
description = "DRE destination plugin: send messages and an output's files by email over SMTP"
version = "1.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
dre-protocol.workspace = true
serde_json.workspace = true
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "hostname", "native-tls"] }

[dev-dependencies]
tempfile.workspace = true
mail-parser = "0.11"
ureq = "3"
